<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prama Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/articles.css">
</head>
<body>

<div class="app-container">
  <section class="hero-section">
    <div class="hero-overlay"></div>
    <div class="top-bar">
      <div>
        <p class="welcome-text">Explore & Understand</p>
        <h1>Prama Learn</h1>
      </div>
      <button class="notification-btn" id="savedFilterBtn">
        <i class="fa-regular fa-bookmark"></i>
      </button>
    </div>

    <div class="search-container">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search topics, questions..." id="articleSearch">
      </div>
    </div>
  </section>

  <section class="info-hub-section">
    <div class="section-header">
      <h3>Biological Guides</h3>
    </div>
    <div class="info-grid">
      <div class="info-box box-pink" data-info="blood-colors"><div class="box-icon"><i class="fa-solid fa-droplet"></i></div><span>Blood Colors</span></div>
      <div class="info-box box-blue" data-info="discharges"><div class="box-icon"><i class="fa-solid fa-water"></i></div><span>Discharges</span></div>
      <div class="info-box box-red" data-info="clots"><div class="box-icon"><i class="fa-solid fa-cloud-showers-heavy"></i></div><span>Blood Clots</span></div>
      <div class="info-box box-purple" data-info="pain-map"><div class="box-icon"><i class="fa-solid fa-bolt-lightning"></i></div><span>Pain Zones</span></div>
      <div class="info-box box-teal" data-info="products"><div class="box-icon"><i class="fa-solid fa-box-tissue"></i></div><span>Products</span></div>
      <div class="info-box box-orange" data-info="illnesses"><div class="box-icon"><i class="fa-solid fa-heart-pulse"></i></div><span>Illnesses</span></div>
    </div>
  </section>

  <section class="myth-section">
    <div class="section-header">
      <h3>Myths vs. Facts</h3>
      <a href="myths.html" class="view-all-myths-btn">
        See All <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>
    <div class="myth-container" id="mythContainer"></div>
  </section>

  <section class="article-section">
    <div class="section-header">
      <h3>Recent Articles & Reading</h3>
    </div>
    <div class="article-list" id="articleList"></div>
  </section>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="tracking.html" class="nav-item"><i class="fa-solid fa-chart-line"></i><span>Track</span></a>
    <a href="doctors.html" class="nav-item"><i class="fa-solid fa-user-doctor"></i><span>Doctors</span></a>
    <a href="articles.html" class="nav-item active"><i class="fa-solid fa-book-open"></i><span>Learn</span></a>
    <a href="community.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Community</span></a>
  </nav>
</div>

<script type="module" src="js/articles.js"></script>
</body>
</html>
